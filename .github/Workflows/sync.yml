name: GlucoseSync Sync

on:
  schedule:
    - cron: '0 */6 * * *'   # Cada 6 horas
  workflow_dispatch:       # Permite ejecución manual

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
            python-version: '3.13'
            cache: 'pip'

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run GlucoseSync collector
        env:
            ABBOTT_EMAIL: ${{ secrets.ABBOTT_EMAIL }}
            ABBOTT_PASSWORD: ${{ secrets.ABBOTT_PASSWORD }}
        run: python collector.py

      - name: Run history export
        run: python history_export.py

      - name: Create or update GitHub Release
        uses: ncipollo/release-action@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tag: glucose-latest
          name: 'GlucoseSync Datos'
          body: 'Publicación automática del histórico de GlucoseSync.'
          commit: ${{ github.sha }}
          allowUpdates: true
          artifacts: |
            database/glucosesync.db
            datos/glucose_history.csv
          prerelease: false
